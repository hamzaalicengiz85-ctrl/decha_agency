[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"

# NODE_ENV burada "production" yapılmamalı: npm bu durumda devDependencies'i
# hiç kurmuyor, vite / tailwind / postcss gelmediği için build
# "vite: not found" ile düşüyor. Vite zaten `vite build` ile üretim modunda
# çalışır, ayrıca ayarlamaya gerek yok.

# SPA fallback: tüm rotalar index.html'e yönlenir (React Router client-side routing)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # Yönetim önizlemesi siteyi kendi kaynağından iframe'e alıyor; SAMEORIGIN
    # bunu bozmadan yabancı sitelerde çerçevelenmeyi engelliyor.
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy = "same-origin"
    X-DNS-Prefetch-Control = "off"
    # style-src'de 'unsafe-inline' zorunlu: React bileşenleri (önizleme
    # çerçevesinin ölçeği, ilerleme çubukları) style özniteliği yazıyor.
    # script-src'de yok — tüm betikler paketlenmiş dosyalardan geliyor.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; frame-src 'self'; frame-ancestors 'self'; form-action 'self'; base-uri 'none'; object-src 'none'; manifest-src 'self'; upgrade-insecure-requests"

# Yönetim paneli arama motorlarında görünmesin (robots.txt'e ek güvence:
# doğrudan bağlantı verilse bile dizine alınmaz).
[[headers]]
  for = "/yonetim"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
