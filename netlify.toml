[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"

# NODE_ENV burada "production" yapılmamalı: npm bu durumda devDependencies'i
# hiç kurmuyor, vite / tailwind / postcss gelmediği için build
# "vite: not found" ile düşüyor. Vite zaten `vite build` ile üretim modunda
# çalışır, ayrıca ayarlamaya gerek yok.

# SPA fallback: tüm rotalar index.html'e yönlenir (React Router client-side routing)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
